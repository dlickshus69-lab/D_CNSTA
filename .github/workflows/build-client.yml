# Builds the client DLLs on a GitHub Windows machine with the toolchain from the client README
# (MSYS2 MINGW64, CMake, liblzma, APCpp at its pinned revision) and packages the apworld.
# Every build is kept under the run's "Artifacts". The Releases page has two releases (V1.3.5):
# - the Testing build, from main: "Dlickshus Crash Bandicoot N. Sane Trilogy Archipelago V<major.minor>.<build> (Testing build)"
#   (tag v<major.minor>.<build>, a pre-release): major.minor comes from the VERSION file, the last number counts builds
#   of main since that version started: main's successful builds so far plus this one, minus VERSION_FIRST_RUN, plus 1;
#   build 0 is shown as just the version (V1.3). Only main's successful builds count (V1.3.6), so a Stable build or a
#   cancelled one doesn't make the Testing numbers skip; VERSION_FIRST_RUN 130 makes main's 136th successful build V1.3.6.
# - the Stable build, from the stable branch: "... V<STABLE_VERSION> (Stable build)" (tag stable-v<STABLE_VERSION>-<run>,
#   marked Latest): everything finished and in ongoing testing, without what's still being worked on.
# Only the newest of each is kept, and the skins release stays.
name: Build client

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-xz

      - name: Fetch APCpp at the pinned revision
        run: |
          git clone --recursive https://github.com/randomcodegen/APCpp.git references/APCpp
          git -C references/APCpp checkout 5eb74d0ee8df27fa1033c2c38d3e03ab1c951241
          git -C references/APCpp submodule update --init --recursive

      - name: Configure
        # link liblzma statically like the official client; otherwise the DLL needs liblzma-5.dll at runtime
        run: >-
          cmake -S CrashNST-AP-Client/client -B build/client -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DLIBLZMA_LIBRARY="$(cygpath -m /mingw64/lib/liblzma.a)"
          -DLIBLZMA_INCLUDE_DIR="$(cygpath -m /mingw64/include)"

      - name: Build
        # compiler errors are repeated as annotations, so they can be read from the API without the full log
        run: |
          set -o pipefail
          if ! cmake --build build/client --parallel 4 -- -k 2>&1 | tee build.log; then
            grep -E "error|undefined reference" build.log | head -10 | while IFS= read -r line; do
              echo "::error::${line//%/%25}"
            done
            all=$(grep -E -B1 -A3 ": error|undefined reference|fatal error" build.log | head -120 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Build errors::$all"
            exit 1
          fi

      - name: Check the DLLs only need files Windows ships with
        run: |
          for dll in build/client/crash_nst_ingame.dll build/client/proxy/dinput8.dll; do
            echo "$dll imports:"
            objdump -p "$dll" | awk '/DLL Name/ {print "  " $3}' | sort -u | tee imports.txt
            if grep -iE '^ *lib[^ ]*\.dll$' imports.txt; then
              echo "::error::$dll depends on a MinGW runtime DLL that players do not have"
              exit 1
            fi
          done

      - name: Arrange files like the game folder
        run: |
          mkdir -p package/CrashNSTAP
          cp build/client/proxy/dinput8.dll package/
          cp build/client/crash_nst_ingame.dll package/CrashNSTAP/
          cp -r CrashNST-AP-Client/licenses package/CrashNSTAP/
          mkdir -p package/CrashNSTAP/skins
          cp CrashNST-AP-Client/skins/README.txt package/CrashNSTAP/skins/
          cp CrashNST-AP-Client/THIRD_PARTY.md CrashNST-AP-Client/PLAYER_GUIDE.md package/CrashNSTAP/
          cp CrashNST-AP-Client/README.md package/
          (cd package && zip -r ../CrashNST-AP-Client-x64.zip .)

      - name: Build the apworld
        # the Testing build's apworld is crash_nst_testing.apworld, the game "Crash Bandicoot N. Sane Trilogy (Testing)",
        # so it can be installed next to the Stable build's crash_nst.apworld
        shell: pwsh
        run: |
          if ("$env:GITHUB_REF_NAME" -eq "stable") { python CrashNST-APWorld/tools/build_apworld.py } else { python CrashNST-APWorld/tools/build_apworld.py --testing }

      - uses: actions/upload-artifact@v4
        with:
          name: CrashNST-AP-Client-x64
          path: package/

      - name: Publish the release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stable'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $stable = "$env:GITHUB_REF_NAME" -eq "stable"
          if ($stable) {
            # the stable branch says which version it is
            $version = (Get-Content STABLE_VERSION -Raw).Trim()
            $tag = "stable-v$version-$env:GITHUB_RUN_NUMBER"
            $kind = "Stable build"
          } else {
            # main's successful builds so far, plus this one
            $count = [int](gh api "repos/$env:GH_REPO/actions/workflows/build-client.yml/runs?branch=main&status=success&per_page=1" --jq .total_count) + 1
            if ($LASTEXITCODE -ne 0 -or $count -lt 2) { Write-Host "::error::Could not count main's builds"; exit 1 }
            $build = $count - [int]((Get-Content VERSION_FIRST_RUN -Raw).Trim()) + 1
            if ($build -lt 0) { $build = [int]$env:GITHUB_RUN_NUMBER }
            # build 0 is the version itself (V1.3), the builds after it V1.3.1, V1.3.2, ...
            $version = if ($build -eq 0) { (Get-Content VERSION -Raw).Trim() } else { "$((Get-Content VERSION -Raw).Trim()).$build" }
            $tag = "v$version"
            $kind = "Testing build"
          }
          # every build gets its own tag: GitHub may refuse to reuse a deleted release's tag
          if ([int]$env:GITHUB_RUN_ATTEMPT -gt 1) { $tag = "$tag-$env:GITHUB_RUN_ATTEMPT" }
          # the release text: what's in this build (RELEASE_NOTES.md, written with each change), read by gh from the file
          # (passed as text, quotes in it split it into several arguments: the V1.3 Stable build's "#RRGGBB")
          # (typed lists: a one-item list from an if would become plain text, and splatting text passes it letter by letter)
          [string[]]$notes = if (Test-Path RELEASE_NOTES.md) { @("--notes-file", "RELEASE_NOTES.md") } else { @("--notes", "") }
          $title = "Dlickshus Crash Bandicoot N. Sane Trilogy Archipelago V$version ($kind)"
          [string[]]$mark = if ($stable) { @("--latest") } else { @("--prerelease", "--latest=false") }
          $created = $false
          for ($attempt = 1; $attempt -le 3 -and -not $created; $attempt++) {
            $apworld = if ($stable) { "CrashNST-APWorld/dist/crash_nst.apworld" } else { "CrashNST-APWorld/dist/crash_nst_testing.apworld" }
            $out = (gh release create $tag CrashNST-AP-Client-x64.zip $apworld `
              --title $title @notes --target $env:GITHUB_SHA @mark 2>&1) | Out-String
            if ($LASTEXITCODE -eq 0) { $created = $true; break }
            # an annotation, so the error can be read from the API without the full log
            Write-Host "::warning::Release attempt $attempt failed: $($out.Trim())"
            Start-Sleep -Seconds 20
          }
          if (-not $created) { Write-Host "::error::Could not create release $tag"; exit 1 }
          # keep only the newest of this kind (stable or testing); the other kind and the skins release stay
          $filter = if ($stable) { 'select(.tagName | startswith("stable-"))' } else { 'select((.tagName | startswith("skins") | not) and (.tagName | startswith("stable-") | not))' }
          $old = gh release list --limit 100 --json tagName,createdAt --jq "[.[] | $filter] | sort_by(.createdAt) | reverse | .[1:] | .[].tagName"
          foreach ($t in $old) {
            gh release delete $t --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Could not remove old release $t" }
          }
          exit 0
