# Builds the client DLLs on a GitHub Windows machine with the toolchain from the client README
# (MSYS2 MINGW64, CMake, liblzma, APCpp at its pinned revision) and packages the apworld.
# Every build is kept under the run's "Artifacts". Builds of main also refresh the latest release
# on the Releases page, named "Dlickshus Crash Bandicoot N. Sane Trilogy Archipelago V<major.minor>.<build>":
# major.minor comes from the VERSION file, the last number is the build (run) number.
name: Build client

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-xz

      - name: Fetch APCpp at the pinned revision
        run: |
          git clone --recursive https://github.com/randomcodegen/APCpp.git references/APCpp
          git -C references/APCpp checkout 5eb74d0ee8df27fa1033c2c38d3e03ab1c951241
          git -C references/APCpp submodule update --init --recursive

      - name: Configure
        # link liblzma statically like the official client; otherwise the DLL needs liblzma-5.dll at runtime
        run: >-
          cmake -S CrashNST-AP-Client/client -B build/client -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          -DLIBLZMA_LIBRARY="$(cygpath -m /mingw64/lib/liblzma.a)"
          -DLIBLZMA_INCLUDE_DIR="$(cygpath -m /mingw64/include)"

      - name: Build
        run: cmake --build build/client --parallel 4

      - name: Check the DLLs only need files Windows ships with
        run: |
          for dll in build/client/crash_nst_ingame.dll build/client/proxy/dinput8.dll; do
            echo "$dll imports:"
            objdump -p "$dll" | awk '/DLL Name/ {print "  " $3}' | sort -u | tee imports.txt
            if grep -iE '^ *lib[^ ]*\.dll$' imports.txt; then
              echo "::error::$dll depends on a MinGW runtime DLL that players do not have"
              exit 1
            fi
          done

      - name: Arrange files like the game folder
        run: |
          mkdir -p package/CrashNSTAP
          cp build/client/proxy/dinput8.dll package/
          cp build/client/crash_nst_ingame.dll package/CrashNSTAP/
          cp -r CrashNST-AP-Client/licenses package/CrashNSTAP/
          cp CrashNST-AP-Client/THIRD_PARTY.md CrashNST-AP-Client/PLAYER_GUIDE.md package/CrashNSTAP/
          cp CrashNST-AP-Client/README.md package/
          (cd package && zip -r ../CrashNST-AP-Client-x64.zip .)

      - name: Build the apworld
        shell: pwsh
        run: python CrashNST-APWorld/tools/build_apworld.py

      - uses: actions/upload-artifact@v4
        with:
          name: CrashNST-AP-Client-x64
          path: package/

      - name: Publish the latest release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $sha = "$env:GITHUB_SHA".Substring(0, 7)
          $version = "$((Get-Content VERSION -Raw).Trim()).$env:GITHUB_RUN_NUMBER"
          $notes = @"
          Version V$version, built automatically from commit $sha.

          **Client:** download CrashNST-AP-Client-x64.zip, back up your old dinput8.dll and CrashNSTAP folder, then extract the zip next to CrashBandicootNSaneTrilogy.exe.

          **Archipelago:** put crash_nst.apworld in Archipelago's custom_worlds folder.
          "@
          $existing = gh release list --json tagName --jq '.[].tagName'
          if ($existing -contains "latest-build") { gh release delete latest-build --cleanup-tag --yes }
          # GitHub can take a moment to drop the old tag: retry so a hiccup never leaves the Releases page empty
          for ($attempt = 1; $attempt -le 5; $attempt++) {
            gh release create latest-build CrashNST-AP-Client-x64.zip CrashNST-APWorld/dist/crash_nst.apworld `
              --title "Dlickshus Crash Bandicoot N. Sane Trilogy Archipelago V$version" --notes $notes --target $env:GITHUB_SHA --latest
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Release attempt $attempt failed; retrying in 20 seconds"
            Start-Sleep -Seconds 20
          }
          exit 1
